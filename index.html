<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>حضور الطلبة QR</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.top h1{font-size:22px;margin:0}.muted{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{font-size:13px;color:#374151}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;margin-top:6px}button{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:700}.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px}.pill.absent{background:#fef2f2;color:#b91c1c}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa}.stat b{display:block;font-size:24px;margin-top:4px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modalbox{background:#fff;border-radius:18px;padding:16px;width:min(520px,100%)}video{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}#status{min-height:20px;margin-top:8px}.ok{color:#047857}.err{color:#b91c1c}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}.small{font-size:12px}.qr{display:flex;justify-content:center;padding:12px}.qr canvas{max-width:220px;height:auto}.nav{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.nav button{white-space:nowrap}.active{background:#111827;color:#fff}.filelabel{display:inline-block;background:#e5e7eb;padding:11px 14px;border-radius:11px;font-weight:700;cursor:pointer}.filelabel input{display:none}
</style></head><body><main class="app">
<div class="top"><div><h1>📋 نظام حضور الطلبة</h1><div class="muted">QR • حضور • غياب • تقارير</div></div><button id="install" class="secondary hidden">تثبيت التطبيق</button></div>
<div class="nav"><button class="active" data-tab="home">الرئيسية</button><button data-tab="students">الطلبة</button><button data-tab="attendance">الحضور</button><button data-tab="reports">التقارير</button></div>
<section id="home" class="tab"><div class="card"><div class="grid"><label>المادة/المحاضرة<input id="course" placeholder="مثلاً: نظرية الزمر"></label><label>التاريخ<input id="date" type="date"></label></div><div class="actions" style="margin-top:12px"><button id="startScan" class="primary">📷 مسح QR بالكاميرا</button><button id="stopScan" class="secondary hidden">إيقاف الكاميرا</button></div><div id="status" class="muted"></div></div><div class="stats"><div class="stat">الطلبة<b id="stTotal">0</b></div><div class="stat">الحاضرون<b id="stPresent">0</b></div><div class="stat">الغائبون<b id="stAbsent">0</b></div></div><div class="card"><h3>آخر عمليات الحضور</h3><div id="recent"></div></div></section>
<section id="students" class="tab hidden"><div class="card"><h3>إضافة طالب</h3><div class="grid"><label>الاسم<input id="sName" placeholder="اسم الطالب الكامل"></label><label>الرقم الجامعي<input id="sId" placeholder="رقم فريد"></label></div><button id="addStudent" class="primary" style="margin-top:12px">إضافة وإنشاء QR</button></div><div class="card"><div class="actions"><button id="exportStudents" class="secondary">تصدير الطلبة CSV</button><label class="filelabel">استيراد CSV<input id="importStudents" type="file" accept=".csv,text/csv"></label></div><div id="studentList"></div></div></section>
<section id="attendance" class="tab hidden"><div class="card"><h3>سجل اليوم</h3><div class="grid"><label>المادة<input id="filterCourse" placeholder="كل المواد"></label><label>التاريخ<input id="filterDate" type="date"></label></div><div id="attendanceList" class="tablewrap" style="margin-top:12px"></div></div></section>
<section id="reports" class="tab hidden"><div class="card"><h3>تقرير الحضور</h3><div class="actions"><button id="exportAttendance" class="primary">تصدير سجل الحضور CSV</button><button id="backup" class="secondary">نسخة احتياطية JSON</button><label class="filelabel">استعادة JSON<input id="restore" type="file" accept="application/json"></label></div><div id="reportTable" class="tablewrap" style="margin-top:12px"></div></div></section>
</main>
<div id="scanModal" class="modal hidden"><div class="modalbox"><h3>وجّه الكاميرا نحو QR الطالب</h3><video id="video" playsinline></video><div id="scanMsg" class="muted" style="margin-top:8px"></div><button id="closeScan" class="secondary" style="margin-top:10px;width:100%">إغلاق</button></div></div>
<div id="qrModal" class="modal hidden"><div class="modalbox"><h3 id="qrName"></h3><div id="qrCode" class="qr"></div><div id="qrId" class="muted" style="text-align:center"></div><button id="closeQr" class="secondary" style="margin-top:10px;width:100%">إغلاق</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const KEY='attendance_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"students":[],"attendance":[]}');let stream=null,scanTimer=null,lastCode='',lastAt=0;const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);$('date').value=today();$('filterDate').value=today();
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
function render(){const d=$('date').value||today(),c=$('course').value.trim();const rec=db.attendance.filter(x=>x.date===d&&( !c||x.course===c));$('stTotal').textContent=db.students.length;$('stPresent').textContent=new Set(rec.map(x=>x.studentId)).size;$('stAbsent').textContent=Math.max(0,db.students.length-new Set(rec.map(x=>x.studentId)).size);$('recent').innerHTML=rec.slice(-8).reverse().map(x=>{let s=db.students.find(y=>y.id===x.studentId);return `<div class="row"><div><b>${esc(s?s.name:x.studentId)}</b><div class="muted">${esc(x.course||'بدون مادة')} • ${esc(x.time)}</div></div><span class="pill">حاضر</span></div>`}).join('')||'<div class="muted">لا توجد عمليات بعد.</div>';
$('studentList').innerHTML=db.students.map(s=>`<div class="row"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.id)}</div></div><div class="actions"><button class="secondary showqr" data-id="${esc(s.id)}">QR</button><button class="danger del" data-id="${esc(s.id)}">حذف</button></div></div>`).join('')||'<div class="muted">لم تتم إضافة طلبة.</div>';
$('attendanceList').innerHTML=buildAttendance($('filterDate').value||today(),$('filterCourse').value.trim());$('reportTable').innerHTML=buildReport();}
function buildAttendance(d,c){let a=db.attendance.filter(x=>x.date===d&&(!c||x.course===c));let ids=new Set(a.map(x=>x.studentId));return `<table><thead><tr><th>الطالب</th><th>الرقم</th><th>الحالة</th><th>الوقت</th></tr></thead><tbody>${db.students.map(s=>{let x=a.filter(z=>z.studentId===s.id).at(-1);return `<tr><td>${esc(s.name)}</td><td>${esc(s.id)}</td><td>${x?'<span class="pill">حاضر</span>':'<span class="pill absent">غائب</span>'}</td><td>${x?esc(x.time):'-'}</td></tr>`}).join('')}</tbody></table>`}
function buildReport(){let m={};db.attendance.forEach(x=>{let k=x.studentId+'|'+x.course;m[k]=(m[k]||0)+1});return `<table><thead><tr><th>الطالب</th><th>المادة</th><th>مرات الحضور</th></tr></thead><tbody>${Object.entries(m).map(([k,n])=>{let [id,c]=k.split('|'),s=db.students.find(x=>x.id===id);return `<tr><td>${esc(s?s.name:id)}</td><td>${esc(c)}</td><td>${n}</td></tr>`}).join('')}</tbody></table>`}
$('addStudent').onclick=()=>{let name=$('sName').value.trim(),id=$('sId').value.trim();if(!name||!id)return alert('اكتب اسم الطالب والرقم.');if(db.students.some(s=>s.id===id))return alert('الرقم موجود مسبقاً.');db.students.push({name,id});$('sName').value='';$('sId').value='';save();showQR(id)};
function showQR(id){let s=db.students.find(x=>x.id===id);if(!s)return;$('qrName').textContent=s.name;$('qrId').textContent='الرقم: '+s.id;$('qrCode').innerHTML='';new QRCode($('qrCode'),{text:s.id,width:220,height:220});$('qrModal').classList.remove('hidden')}
$('closeQr').onclick=()=>$('qrModal').classList.add('hidden');document.addEventListener('click',e=>{if(e.target.classList.contains('showqr'))showQR(e.target.dataset.id);if(e.target.classList.contains('del')){if(confirm('حذف الطالب وسجل حضوره؟')){let id=e.target.dataset.id;db.students=db.students.filter(s=>s.id!==id);db.attendance=db.attendance.filter(a=>a.studentId!==id);save()}}});
function markPresent(code){code=String(code).trim();let s=db.students.find(x=>x.id===code);if(!s){$('scanMsg').textContent='❌ هذا QR غير مرتبط بطالب مسجل.';return}let date=$('date').value||today(),course=$('course').value.trim()||'بدون مادة';let exists=db.attendance.some(x=>x.studentId===s.id&&x.date===date&&x.course===course);if(exists){$('scanMsg').textContent='⚠️ '+s.name+' مسجل حاضر مسبقاً.';return}let time=new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});db.attendance.push({studentId:s.id,date,course,time});save();$('scanMsg').textContent='✅ تم تسجيل حضور: '+s.name+' — '+time}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia)return alert('الكاميرا تحتاج فتح البرنامج عبر HTTPS أو localhost.');$('scanModal').classList.remove('hidden');$('scanMsg').textContent='جاري تشغيل الكاميرا...';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=stream;await $('video').play();$('scanMsg').textContent='وجّه الكاميرا إلى QR الطالب.';if('BarcodeDetector'in window){let detector=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{let codes=await detector.detect($('video'));if(codes[0]?.rawValue){let code=codes[0].rawValue,now=Date.now();if(code!==lastCode||now-lastAt>2500){lastCode=code;lastAt=now;markPresent(code)}}}catch{}},250)}else{await loadJsQR();scanWithJsQR()}}catch(e){$('scanMsg').textContent='تعذر تشغيل الكاميرا. تأكد من إعطاء إذن الكاميرا وفتح البرنامج عبر HTTPS.'}}
async function loadJsQR(){if(window.jsQR)return;await new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}function scanWithJsQR(){let c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});let loop=()=>{if(!stream)return;c.width=$('video').videoWidth||640;c.height=$('video').videoHeight||480;x.drawImage($('video'),0,0,c.width,c.height);let p=x.getImageData(0,0,c.width,c.height),r=window.jsQR(p.data,p.width,p.height,{inversionAttempts:'dontInvert'});if(r){let now=Date.now();if(r.data!==lastCode||now-lastAt>2500){lastCode=r.data;lastAt=now;markPresent(r.data)}}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
function stopCamera(){$('scanModal').classList.add('hidden');if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null}
$('startScan').onclick=startCamera;$('stopScan').onclick=stopCamera;$('closeScan').onclick=stopCamera;$('filterDate').onchange=render;$('filterCourse').oninput=render;$('course').oninput=render;$('date').onchange=render;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.remove('hidden');b.classList.add('active');render()});
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')};function download(name,text,type='text/csv;charset=utf-8'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('exportStudents').onclick=()=>download('students.csv',csv([['الاسم','الرقم'],...db.students.map(s=>[s.name,s.id])]));$('exportAttendance').onclick=()=>download('attendance.csv',csv([['التاريخ','المادة','الاسم','الرقم','الوقت'],...db.attendance.map(a=>{let s=db.students.find(x=>x.id===a.studentId);return [a.date,a.course,s?s.name:'',a.studentId,a.time]})]));$('backup').onclick=()=>download('attendance-backup.json',JSON.stringify(db,null,2),'application/json');$('importStudents').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{String(r.result).split(/\r?\n/).slice(1).forEach(line=>{let p=line.split(',').map(x=>x.replace(/^"|"$/g,'').replaceAll('""','"'));if(p[0]&&p[1]&&!db.students.some(s=>s.id===p[1]))db.students.push({name:p[0],id:p[1]})});save();alert('تم استيراد الطلبة.')};r.readAsText(f,'UTF-8')};$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.students)||!Array.isArray(x.attendance))throw 0;if(confirm('استبدال البيانات الحالية بالنسخة الاحتياطية؟')){db=x;save();alert('تمت الاستعادة.')}}catch{alert('ملف النسخة الاحتياطية غير صالح.')}};r.readAsText(f)};
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').classList.remove('hidden')});$('install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
